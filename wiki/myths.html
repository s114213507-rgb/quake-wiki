</style></head><body><div class="wrap"><header class="top"><b>地震防災 LLM Wiki</b><a href="../wiki/index.html">Wiki 目錄</a><a href="../slides/index.html">教學簡報</a><a href="../wiki/log.html">工作紀錄</a></header><h1>常見迷思</h1>
<blockquote>
<p>三個常見錯誤：找生命三角、搖的時候衝去關瓦斯、馬上往外跑。</p>
</blockquote>
<p>來源：<a class="src" href="../raw/S03_台灣事實查核中心_地震13大QA.html">[S03]</a> <a class="src" href="../raw/S06_消防署_保命3步驟.html">[S06]</a></p>
<p>相關：<a class="wl" href="during.html">during</a></p>
<table>
<thead>
<tr>
<th>迷思</th>
<th>正確做法</th>
</tr>
</thead>
<tbody>
<tr>
<td>地震要躲「生命三角（黃金三角）」</td>
<td>已過時。倒塌方向無法預測，跑去找反而可能被砸傷，應就地找掩護 <a class="src" href="../raw/S03_台灣事實查核中心_地震13大QA.html">[S03]</a></td>
</tr>
<tr>
<td>一搖就要衝去關瓦斯、電源</td>
<td>不必急。瓦斯公司和台電有自動斷氣、斷電功能；人在廚房才順手關火 <a class="src" href="../raw/S03_台灣事實查核中心_地震13大QA.html">[S03]</a></td>
</tr>
<tr>
<td>地震時趕快跑到外面</td>
<td>不要慌亂逃出戶外，先就地保護頭頸 <a class="src" href="../raw/S06_消防署_保命3步驟.html">[S06]</a></td>
</tr>
</tbody>
</table></div></body></html>
